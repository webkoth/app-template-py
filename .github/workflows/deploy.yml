name: deploy

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apptemplatepy_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Две РАЗНЫЕ базы, а не одна на обе переменные. Обвязка тестов
      # отказывается работать при совпадении адресов намеренно: она
      # сбрасывает схему целиком, и совпадение однажды стоило схемы рабочей
      # базы. Один адрес в обеих переменных ронял бы каждый прогон CI на
      # сборе тестов, ещё до первой проверки.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apptemplatepy_dev
      DATABASE_URL_E2E: postgresql://postgres:postgres@localhost:5432/apptemplatepy_e2e
      APP_ENV: local
      APP_AUTH_SECRET: e2e-secret-not-used-anywhere-real-000000
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5
      # Вторая база. Контейнер Postgres заводит только одну — ту, что в
      # POSTGRES_DB, — а тестам нужны две: прогон pytest сбрасывает схему
      # целиком, и делать это в базе, на которой проверяются миграции,
      # нельзя. psql на ubuntu-latest предустановлен.
      - name: Завести отдельную базу под тесты
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE apptemplatepy_e2e'

      # Полная версия, а не «@v10»: подвижного мажорного тега выше v7 у
      # setup-uv нет, и @v10 не разрешается — прогон падает на подготовке
      # job, до единой своей команды. Проверено первым настоящим прогоном.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --group lint
        working-directory: backend

      # npm ci обязателен ДО `make check`: половину фронтенда тот проверяет
      # только при существующем frontend/node_modules, а без него громко
      # отказывается работать.
      - run: npm ci
        working-directory: frontend

      # Миграции накатываются на рабочую базу — так проверяется, что они
      # ложатся на пустую. `make check` этого не делает намеренно: API-тесты
      # создают схему из метаданных и в ОТДЕЛЬНОЙ базе.
      - run: uv run alembic upgrade head
        working-directory: backend

      # Тот же единственный шаг, что и в ci.yml, и он здесь не лишний:
      # прямой push в main минуя pull request проверок ветки не проходит
      # вовсе. Состав проверок не переписан своими словами — иначе получилось
      # бы уже ТРИ списка одного и того же (Makefile, ci.yml, deploy.yml), и
      # разошлись бы они тем вернее. Подробности — в ci.yml.
      - run: make check

      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      # Слаг НЕ «apptemplate»: так называется TS-шаблон, и контур у них
      # общий. Совпади слаг — и совпадут разом каталог /var/www, имя
      # процесса pm2, база с ролью, vhost в nginx и каталог резервных
      # копий: доставка одного шаблона молча затирала бы другой. Слаг
      # обязан совпасть с тем, с которым будет вызван app-provision.
      SLUG: apptemplatepy
    steps:
      - uses: actions/checkout@v5

      # Фронтенд собирается ЗДЕСЬ, а не на сервере. Так на контуре не
      # оказывается ни Node, ни node_modules: человек, выбравший
      # Python-шаблон, не обнаруживает в бою вторую экосистему. Побочно это
      # снимает с сервера самый прожорливый шаг доставки.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: Записать версию сборки
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          # Пустой результат — не мелочь: при неполном клоне `git rev-parse`
          # печатает пустоту, и файл выходит валидным JSON с пустой версией.
          # Маршрут /api/meta/build-info отдал бы 200 и пустую строку, то есть
          # тихо сообщил бы «версия такая» вместо «версию не знаю» — а идут к
          # нему ровно тогда, когда разбираются, что именно доставлено.
          test -n "$COMMIT" || { echo "git rev-parse вернул пусто"; exit 1; }
          printf '{"commit":"%s","built_at":"%s"}\n' \
            "$COMMIT" "$(date -u +%FT%TZ)" > build-info.json

      - name: Упаковать статику и версию
        run: tar -czf dist.tar.gz -C frontend dist -C ../ build-info.json

      # Проверка до всякой работы. Без секретов доставка падает на `scp
      # deploy@:` — с пустым адресом, вычищенным ключом и без единого слова
      # о причине. А приходит это состояние к каждому, кто сделал проект из
      # шаблона и запушил main раньше, чем завёл контур: первый же push
      # даёт красный крест и сообщение, отправляющее читать про scp.
      - name: Контур заведён
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$SERVER_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Контур не заведён: нет секретов$missing." \
              "Проверки пройдены, доставлять некуда." \
              "Заведи контур командой /onboarding — шаги G и H."
            exit 1
          fi

      - name: Доставка на контур
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          scp dist.tar.gz deploy@${{ secrets.SERVER_HOST }}:/tmp/$SLUG-dist.tar.gz

          # Heredoc В КАВЫЧКАХ, а значения приезжают через окружение
          # команды. Без кавычек раннер раскрывает содержимое сам, и это
          # уже дважды стоило доставки: сначала обратные кавычки в
          # комментарии превращались в подстановку команды, потом — снова,
          # в другом комментарии, где `set -euo\n# pipefail` выполнилось как
          # `set -o`, напечатало список опций шелла, и сервер попытался
          # выполнить «braceexpand on». `bash -n` такого не ловит.
          #
          # С кавычками тело уезжает буквально: ни экранировать $, ни
          # следить за кавычками в комментариях больше не нужно.
          ssh deploy@${{ secrets.SERVER_HOST }} \
            "SLUG='$SLUG' REPO='${{ github.repository }}' bash -s" <<'EOF'
          set -euo pipefail
          DIR=/var/www/$SLUG
          cd "$DIR"
          source "$DIR/.deploy-env"   # даёт PORT

          # Первый деплой: кода ещё нет. Клонировать нельзя — каталог не
          # пуст: app-provision положил туда .env и .deploy-env, а git clone
          # в непустой каталог отказывается. Репозиторий разворачивается на
          # месте; файлы окружения целы — reset --hard не трогает
          # неотслеживаемое.
          if [ ! -d "$DIR/.git" ]; then
            git init -q -b main
            git remote add origin "git@github.com-$SLUG:$REPO.git"
          fi

          git fetch origin main
          git reset --hard origin/main

          # Собранная статика и версия приезжают архивом, а не собираются
          # здесь: Node на этом сервере нет.
          rm -rf "$DIR/frontend/dist"
          mkdir -p "$DIR/frontend"
          tar -xzf /tmp/$SLUG-dist.tar.gz -C "$DIR/frontend" dist
          tar -xzf /tmp/$SLUG-dist.tar.gz -C "$DIR" build-info.json
          rm -f /tmp/$SLUG-dist.tar.gz

          # PATH задаётся явно. `ssh host 'bash -s'` запускает неинтерактивный
          # и не-логин шелл: он не читает ни .bashrc, ни .profile, и PATH
          # приходит куцый — /usr/local/bin:/usr/bin:/bin. node, npm и pm2
          # лежат в нём, потому что стоят системно, а uv ставится в
          # ~/.local/bin под пользователя deploy, и без этой строки доставка
          # падает на «uv: command not found» уже после git reset --hard —
          # то есть на контуре остаётся новый код при старом процессе.
          export PATH="$HOME/.local/bin:$PATH"

          cd "$DIR/backend"
          uv sync --frozen
          # Порядок шагов важен при ОТКАТЕ. Если откаченное дерево не
          # содержит файла ревизии, на которую база уже переведена, alembic
          # падает с «Can't locate revision» и кодом 255, а `set -euo
          # pipefail` роняет шаг здесь — после reset, после подмены статики,
          # после uv sync и ДО pm2 reload. На контуре остаётся старая
          # статика, процесс со старым кодом в памяти и новая схема.
          # Воспроизведено на живой базе. Поэтому откат оставляет файлы
          # миграций на месте — см. шаг 3 docs/commands/rollback.md.
          uv run alembic upgrade head

          export PM2_HOME=/home/deploy/.pm2
          if pm2 describe "$SLUG" > /dev/null 2>&1; then
            pm2 reload "$SLUG" --update-env
          else
            pm2 start "$DIR/backend/.venv/bin/python" --name "$SLUG" \
              --cwd "$DIR/backend" \
              -- -m uvicorn app.main:app --host 127.0.0.1 --port "$PORT"
            pm2 save
          fi

          # Воркер очереди — ВТОРОЙ процесс pm2, рядом с веб-процессом.
          # Поднимает его доставка, а не провижинер: `app-provision` общий с
          # TS-шаблоном, о фоновых задачах не знает и знать не должен —
          # иначе контур перестал бы заводиться одной командой на два
          # шаблона. Побочно это и лечит уже заведённые контуры: воркер
          # появляется на них сам, первой же доставкой, без похода на сервер.
          #
          # Порядок важен: воркер поднимается ПОСЛЕ alembic upgrade head и
          # после веб-процесса. Поднятый раньше миграций, он на первом же
          # обороте возьмёт задачу и пойдёт в таблицы, которых на старой
          # схеме ещё нет.
          if pm2 describe "$SLUG-worker" > /dev/null 2>&1; then
            pm2 reload "$SLUG-worker" --update-env
          else
            pm2 start "$DIR/backend/.venv/bin/python" --name "$SLUG-worker" \
              --cwd "$DIR/backend" -- -m app.worker
            # pm2 save нужен ровно здесь. Список процессов для автозапуска
            # (его поднимает pm2-deploy.service после ребута) берётся из
            # dump.pm2, а тот сохранён тогда, когда воркера ещё не было. Без
            # этой строки воркер переживает доставку, но не переживает
            # перезагрузку сервера — и обнаружилось бы это застрявшей
            # очередью недели спустя, без единой связи с ребутом.
            pm2 save
          fi

          sleep 3
          # Проверяем /api/health, а не корень: корень отдаёт index.html с
          # кодом 200 даже при недоступной базе, и доставка объявляла бы
          # успешным заведомо нерабочий контур.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:$PORT/api/health")
          [ "$CODE" = "200" ] || { echo "контур ответил $CODE"; exit 1; }

          # Живость воркера — отдельной проверкой и не по коду возврата pm2.
          # `pm2 start` отвечает нулём и для процесса, умершего на первом
          # импорте: pm2 перезапустит его следом, а доставка к тому времени
          # уже объявила успех. Спрашиваем и состояние процесса, и его время
          # жизни: у падающего в цикле состояние в момент опроса тоже бывает
          # "online", и отличает его только то, что живёт он меньше паузы
          # выше. Проверка на одно лишь "online" была бы зелёной и на
          # исправном воркере, и на бесконечно падающем, то есть бесполезной.
          #
          # Разбирает ответ python из только что собранного .venv: он здесь
          # заведомо есть, в отличие от jq.
          WORKER_STATE=$(pm2 jlist | "$DIR/backend/.venv/bin/python" -c 'import json,sys,time; found=[p for p in json.load(sys.stdin) if p.get("name")==sys.argv[1]]; env=(found[0].get("pm2_env") or {}) if found else {}; print(env.get("status","absent"), int(time.time()*1000-env["pm_uptime"]) if env.get("pm_uptime") else 0)' "$SLUG-worker")
          WORKER_STATUS=${WORKER_STATE%% *}
          WORKER_ALIVE_MS=${WORKER_STATE##* }
          # Порог вдвое меньше паузы: три секунды сна плюс запрос выше дают
          # исправному процессу заведомо больше двух секунд жизни, а
          # перезапущенному только что — заведомо меньше.
          if [ "$WORKER_STATUS" != "online" ] || [ "$WORKER_ALIVE_MS" -lt 2000 ]; then
            echo "воркер $SLUG-worker не поднялся:" \
              "состояние $WORKER_STATUS, живёт $WORKER_ALIVE_MS мс"
            echo "логи воркера видны только из-под deploy:" \
              "PM2_HOME=/home/deploy/.pm2 pm2 logs $SLUG-worker --lines 50 --nostream"
            exit 1
          fi

          echo "доставлено: $(git rev-parse --short HEAD)"
          echo "процессы pm2: $SLUG и $SLUG-worker ($WORKER_STATUS)"
          EOF
